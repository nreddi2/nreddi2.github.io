<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neelesh Reddi's Noble Raven | ITIS3135 | Class Introductions</title>
    <link rel="icon" type="image/svg+xml" href="images/noble-raven.svg">
    <link rel="stylesheet" href="styles/default.css">
    <link rel="stylesheet" href="styles/class-introductions.css">
    <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
</head>
<body>
    <!-- These include placeholders are replaced by the shared components. -->
    <div data-include="components/header.html"></div>
    <main>
        <h2>Class Introductions</h2>
        <p>Meet the people behind our course sites. Explore their mascots and the quotes they chose for their introductions.</p>
        <p>This directory loads the latest submissions from the <a href="https://intro-form.tommyhost.ing/">class introduction collection</a>.</p>
        <!-- IDs connect the search, loading feedback, and results to JavaScript. The directory class arranges entries. API portraits are permitted outside images/ for this assignment. -->
        <label for="classSearch">Search by Name, Username, or Mascot</label>
        <input type="search" id="classSearch" placeholder="Try Noble Raven or Neelesh" disabled>
        <button type="button" id="reloadIntroductions">Refresh Introductions</button>
        <p id="directoryStatus" role="status" aria-live="polite">Loading introductions…</p>
        <section id="classDirectory" class="directory" aria-label="Class introductions" aria-busy="true"></section>
        <noscript><p>Enable JavaScript to load the class introductions.</p></noscript>
    </main>
    <div data-include="components/footer.html"></div>
    <script src="scripts/class-introductions.js" defer></script>
    <script src="scripts/include-navigation.js"></script>
    <script src="scripts/HTMLInclude.min.js"></script>
    <script src="https://divonbriesen.github.io/teaching/tools/standards-check.js" defer></script>
</body>
</html>
